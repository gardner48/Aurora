[project]
name = "aurorafusion"
dynamic = ["version"]
description = "Aurora package for particle transport, radiation and neutrals in magnetically-confined plasmas"
readme = {file = "README.rst", content-type = "text/x-rst"}  # Explicitly set long_description
authors = [
    { name = "F. Sciortino", email = "sciortino@psfc.mit.edu" },
]
urls = { "Homepage" = "https://github.com/fsciortino/Aurora" }
keywords = ["particle and impurity transport, neutrals, radiation, magnetic confinement fusion"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pexpect",
    "requests",
    "scipy",
]

[project.optional-dependencies]
# Optional features that rely on omfit_classes (reading gEQDSK files, fetching
# data from MDSplus, SOLPS/OEDGE utilities). omfit_classes does not yet support
# NumPy 2, newer xarray, or SciPy >= 1.14 (it uses scipy.integrate.cumtrapz).
omfit = [
    "numpy<2.0.0",
    "scipy<1.14",
    "omfit_classes",
    # transitive dependencies of omfit_classes
    # that omfit_classes does not advertise
    "fortranformat",
    "netCDF4",
    "uncertainties",
    "omas",
    "tqdm",
    # omfit_classes uses xarray.plot.plot, which was removed/renamed
    # in October 2022; this constrains xarray<=v2022.09.0
    "xarray==v2022.09.0",
]

[build-system]
# scikit-build-core is used to integrate with CMake
requires = ["scikit-build-core>=0.8", "numpy"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.8"
ninja.version = ">=1.10"
cmake.version = ">=3.17.2"
wheel.packages = ["aurora"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "aurora/__init__.py"
